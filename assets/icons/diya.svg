<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Diya base with golden warm gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="30%" stop-color="#FF9100"/>
      <stop offset="70%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FFFF8D"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Diya clay/brass base -->
  <path d="M15 62 C 15 82, 85 82, 85 62 C 85 60, 70 56, 50 56 C 30 56, 15 60, 15 62 Z" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1.5"/>
  <ellipse cx="50" cy="60" rx="32" ry="7" fill="#4E2600" opacity="0.6"/>
  <!-- Diya rim stand -->
  <path d="M40 78 Q 50 86 60 78 L 65 84 Q 50 90 35 84 Z" fill="url(#goldGrad)"/>

  <!-- Flame with glow -->
  <path d="M50 56 C 40 45, 42 32, 50 18 C 58 32, 60 45, 50 56 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <!-- Inner bright flame core -->
  <path d="M50 54 C 45 46, 46 37, 50 26 C 54 37, 55 46, 50 54 Z" fill="#FFFFFF" opacity="0.85"/>
</svg>
