<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldFlute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="peacockEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#0091EA"/>
      <stop offset="80%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>
  </defs>

  <!-- Peacock Feather Spines / Fringe -->
  <path d="M50 15 C 30 18, 25 35, 45 55 C 55 45, 65 30, 50 15 Z" fill="#00C853" opacity="0.35"/>
  <path d="M50 20 C 35 22, 32 36, 46 50 C 56 42, 62 30, 50 20 Z" fill="#00E676" opacity="0.5"/>
  <path d="M50 24 C 38 26, 36 38, 47 46 C 54 40, 58 32, 50 24 Z" fill="url(#peacockEye)"/>
  <circle cx="48" cy="34" r="5" fill="#FFD54F"/>
  <circle cx="48" cy="34" r="2.5" fill="#1A237E"/>

  <!-- Feather Stem -->
  <path d="M47 50 Q 55 65 60 85" stroke="#81C784" stroke-width="2" stroke-linecap="round"/>

  <!-- Bansuri (Golden Flute) - angled elegantly -->
  <rect x="15" y="65" width="72" height="7" rx="3.5" transform="rotate(-25 50 68)" fill="url(#goldFlute)" stroke="#FFE082" stroke-width="0.8"/>
  
  <!-- Flute Holes -->
  <circle cx="45" cy="62" r="1.5" fill="#4E2600"/>
  <circle cx="53" cy="58" r="1.5" fill="#4E2600"/>
  <circle cx="61" cy="54" r="1.5" fill="#4E2600"/>
  <circle cx="69" cy="50" r="1.5" fill="#4E2600"/>
  
  <!-- Decorative Tassels -->
  <path d="M22 80 Q 20 88 25 92" stroke="#FF5252" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="25" cy="92" r="2" fill="#FFD54F"/>
</svg>
